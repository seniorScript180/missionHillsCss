<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTA Button Example</title>
    <style>
        /* Base Class */
        .cta {
            position: relative;
            display: inline-block;
            padding: .375rem 1.25rem;
            font-size: 1.25rem;
            line-height: 2.125;
            font-weight: 500;
            text-align: center;
            text-transform: uppercase;
            text-decoration: none;
            border: 0.125rem solid var(--cta-border-color, var(--primary)); /* default border */
            border-radius: var(--cta-border-radius, 0px); /* default radius */
            cursor: pointer;
            transition: background-color var(--transition-base), border-color var(--transition-base);
        }

        /* Solid Class Variations */
        .cta-solid-on-dark {
            color: var(--white);
            background-color: var(--primary);
        }

        .cta-solid-on-dark:hover {
            color: var(--dark);
            background-color: var(--white);
            border-color: var(--primary);
        }

        .cta-solid-on-primary {
            color: var(--white);
            background-color: var(--primary-dark);
        }

        .cta-solid-on-primary:hover {
            color: var(--dark);
            background-color: var(--white);
            border-color: var(--white);
        }

        .cta-solid-on-light {
            color: var(--white);
            background-color: var(--primary);
            border-color: var(--dark);
        }

        .cta-solid-on-light:hover {
            color: var(--dark);
            background-color: var(--white);
            border-color: var(--primary);
        }

        /* Outline Class Variations */
        .cta-outline {
            color: var(--cta-text-color, var(--white));
            background-color: var(--transparent);
            border-color: var(--cta-border-color, var(--primary));
        }

        .cta-outline-on-dark:hover,
        .cta-outline-on-primary:hover,
        .cta-outline-on-light:hover {
            background-color: var(--cta-hover-bg, var(--primary));
            color: var(--cta-hover-text-color, var(--dark));
        }

        .cta-outline-on-dark:hover {
            border-color: var(--primary);
        }

        .cta-outline-on-primary:hover {
            color: var(--dark);
            border-color: var(--white);
        }

        .cta-outline-on-light:hover {
            color: var(--white);
            border-color: var(--primary);
        }

        /* Example variables for demonstration */
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --dark: #343a40;
            --white: #ffffff;
            --transparent: transparent;
            --cta-border-color: #007bff;
            --cta-text-color: #ffffff;
            --cta-hover-bg: #ffffff;
            --cta-hover-text-color: #343a40;
            --transition-base: 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Call-to-Action Buttons -->
    <a href="#" class="cta cta-solid-on-dark">Solid Dark</a>
    <a href="#" class="cta cta-solid-on-primary">Solid Primary</a>
    <a href="#" class="cta cta-solid-on-light">Solid Light</a>
    <a href="#" class="cta cta-outline cta-outline-on-dark">Outline Dark</a>
    <a href="#" class="cta cta-outline cta-outline-on-primary">Outline Primary</a>
    <a href="#" class="cta cta-outline cta-outline-on-light">Outline Light</a>

</body>
</html>
